const vocabularyData = rawData.map(d => ({english: d[0], japanese: d[1], sentence: d[2], sentence_ja: d[3]}));

let selectedWords=[],currentWordIndex=0,learningMode='word',quizQuestions=[],currentQuestionIndex=0,score=0,incorrectAnswers=[],voices=[],recognition,mediaRecorder,audioChunks=[],recordedAudioURL=null;
const els={setupSection:document.getElementById('setup-section'),learningSection:document.getElementById('learning-section'),testOptionsSection:document.getElementById('test-options-section'),quizSection:document.getElementById('quiz-section'),resultsSection:document.getElementById('results-section'),wordList:document.getElementById('word-list'),flashcardContainer:document.getElementById('flashcard-container'),englishText:document.getElementById('english-text'),japaneseWrapper:document.getElementById('japanese-wrapper'),japaneseText:document.getElementById('japanese-text'),progressIndicator:document.getElementById('progress-indicator'),illustrationArea:document.getElementById('illustration-area'),pronunciationFeedback:document.getElementById('pronunciation-feedback-container'),micIcon:document.getElementById('mic-icon'),recordingPlayer:document.getElementById('recording-player')};

document.addEventListener('DOMContentLoaded',()=>{renderWordList();initSpeech();switchSection('setup')});
function renderWordList(){els.wordList.innerHTML='';vocabularyData.forEach((word,index)=>{const div=document.createElement('div');div.className='relative flex items-start p-3 bg-white border border-slate-200 rounded-lg hover:border-brand-300 transition-colors cursor-pointer group';div.innerHTML=`<div class="flex items-center h-5"><input type="checkbox" class="word-checkbox" data-index="${index}"></div><div class="ml-3 text-sm"><label class="font-bold text-slate-800 block cursor-pointer group-hover:text-brand-600">${word.english}</label><p class="text-slate-500 text-xs mt-1 cursor-pointer">${word.japanese}</p></div>`;div.addEventListener('click',(e)=>{if(e.target.type!=='checkbox'){const cb=div.querySelector('input');cb.checked=!cb.checked}});els.wordList.appendChild(div)})}
function switchSection(name){['setupSection','learningSection','testOptionsSection','quizSection','resultsSection'].forEach(k=>{els[k].classList.add('hidden');els[k].classList.remove('animate-fade-in')});const target=els[name+'Section'];target.classList.remove('hidden');requestAnimationFrame(()=>target.classList.add('animate-fade-in'))}
function updateCard(){const word=selectedWords[currentWordIndex],mode=document.querySelector('input[name="mode"]:checked').value;els.japaneseWrapper.classList.remove('opacity-100','translate-y-0');els.japaneseWrapper.classList.add('opacity-0','translate-y-4');els.pronunciationFeedback.innerHTML='';els.englishText.className="text-3xl sm:text-4xl md:text-5xl font-bold text-slate-800 mb-6 leading-tight select-text";if(mode==='sentence'&&word.sentence){els.illustrationArea.classList.remove('hidden');const escapedWord=word.english.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').split(' ')[0],regex=new RegExp(`(${escapedWord}\\w*)`,'gi');els.englishText.innerHTML=word.sentence.replace(regex,'<span class="text-brand-600 border-b-2 border-brand-200">$1</span>');els.japaneseText.innerHTML=word.sentence_ja||word.japanese;els.englishText.classList.remove('text-5xl');els.englishText.classList.add('text-2xl','md:text-3xl')}else{els.illustrationArea.classList.add('hidden');els.englishText.textContent=word.english;els.japaneseText.textContent=word.japanese}els.progressIndicator.textContent=`${currentWordIndex+1} / ${selectedWords.length}`;const prevBtn=document.getElementById('prev-btn'),nextBtn=document.getElementById('next-btn');prevBtn.disabled=currentWordIndex===0;nextBtn.disabled=currentWordIndex===selectedWords.length-1;prevBtn.classList.toggle('opacity-50',prevBtn.disabled);nextBtn.classList.toggle('opacity-50',nextBtn.disabled)}
function generateQuiz(count){const pool=[...selectedWords].sort(()=>0.5-Math.random()).slice(0,count);quizQuestions=pool.map(w=>{const correct=w.japanese,distractors=vocabularyData.filter(x=>x.japanese!==correct).sort(()=>0.5-Math.random()).slice(0,3).map(x=>x.japanese);return{q:w.english,correct,opts:[correct,...distractors].sort(()=>0.5-Math.random())}});score=0;currentQuestionIndex=0;incorrectAnswers=[];showQuizQuestion();switchSection('quiz')}
function showQuizQuestion(){const q=quizQuestions[currentQuestionIndex];document.getElementById('quiz-question').textContent=q.q;document.getElementById('quiz-progress').textContent=`${currentQuestionIndex+1}/${quizQuestions.length}`;const optsEl=document.getElementById('quiz-options');optsEl.innerHTML='';document.getElementById('feedback').innerHTML='';document.getElementById('next-question-btn').classList.add('hidden');q.opts.forEach(opt=>{const btn=document.createElement('div');btn.className='quiz-option text-lg font-medium';btn.textContent=opt;btn.onclick=()=>handleAnswer(btn,opt,q);optsEl.appendChild(btn)})}
function handleAnswer(btn,ans,q){if(document.querySelector('.quiz-option.correct'))return;const isCorrect=ans===q.correct;if(isCorrect){btn.classList.add('correct');document.getElementById('feedback').innerHTML='<span class="text-green-600"><i class="fas fa-check-circle"></i> 正解!</span>';score++}else{btn.classList.add('incorrect');[...document.querySelectorAll('.quiz-option')].forEach(el=>{if(el.textContent===q.correct)el.classList.add('correct')});document.getElementById('feedback').innerHTML=`<span class="text-red-500"><i class="fas fa-times-circle"></i> 正解: ${q.correct}</span>`;incorrectAnswers.push({q:q.q,a:q.correct})}document.getElementById('next-question-btn').classList.remove('hidden')}
function initSpeech(){if('speechSynthesis'in window)window.speechSynthesis.onvoiceschanged=()=>voices=window.speechSynthesis.getVoices();window.SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!window.SpeechRecognition)document.getElementById('record-btn').classList.add('btn-disabled')}
function speakText(text){const u=new SpeechSynthesisUtterance(text.replace(/<[^>]*>/g,''));u.lang='en-US';u.rate=0.9;const v=voices.find(x=>x.name.includes('Google US English'))||voices.find(x=>x.name.includes('Samantha'))||voices.find(x=>x.lang==='en-US');if(v)u.voice=v;window.speechSynthesis.speak(u)}
document.getElementById('select-all').onclick=()=>document.querySelectorAll('.word-checkbox').forEach(c=>c.checked=true);document.getElementById('deselect-all').onclick=()=>document.querySelectorAll('.word-checkbox').forEach(c=>c.checked=false);
document.getElementById('start-learning-btn').onclick=()=>{const checks=document.querySelectorAll('.word-checkbox:checked');if(!checks.length)return alert('単語を選択してください');selectedWords=Array.from(checks).map(c=>vocabularyData[c.dataset.index]);currentWordIndex=0;updateCard();switchSection('learning')};
document.getElementById('quick-test-btn').onclick=()=>{const checks=document.querySelectorAll('.word-checkbox:checked');if(!checks.length)return alert('単語を選択してください');selectedWords=Array.from(checks).map(c=>vocabularyData[c.dataset.index]);const div=document.getElementById('test-choices');div.innerHTML='';[10,20,selectedWords.length].filter((v,i,a)=>a.indexOf(v)===i&&v<=selectedWords.length).sort((a,b)=>a-b).forEach(n=>{const b=document.createElement('button');b.className='btn btn-primary w-24 h-24 flex flex-col items-center justify-center text-xl shadow-lg';b.innerHTML=`<span class="font-bold text-3xl">${n}</span><span class="text-xs">問</span>`;b.onclick=()=>generateQuiz(n);div.appendChild(b)});switchSection('testOptions')};
els.flashcardContainer.onclick=()=>{els.japaneseWrapper.classList.toggle('opacity-0');els.japaneseWrapper.classList.toggle('opacity-100');els.japaneseWrapper.classList.toggle('translate-y-4');els.japaneseWrapper.classList.toggle('translate-y-0')};
document.getElementById('prev-btn').onclick=()=>{if(currentWordIndex>0){currentWordIndex--;updateCard()}};document.getElementById('next-btn').onclick=()=>{if(currentWordIndex<selectedWords.length-1){currentWordIndex++;updateCard()}};document.getElementById('speak-btn').onclick=(e)=>{e.stopPropagation();speakText(els.englishText.textContent)};
document.getElementById('record-btn').onclick=async(e)=>{e.stopPropagation();if(!window.SpeechRecognition)return alert('このブラウザは音声認識をサポートしていません');if(recognition&&recognition.started){recognition.stop();if(mediaRecorder&&mediaRecorder.state==='recording')mediaRecorder.stop();return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});mediaRecorder=new MediaRecorder(stream);audioChunks=[];mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);mediaRecorder.onstop=()=>{const blob=new Blob(audioChunks,{type:'audio/wav'});recordedAudioURL=URL.createObjectURL(blob);els.recordingPlayer.src=recordedAudioURL;document.getElementById('play-recording-btn').disabled=false;document.getElementById('play-recording-btn').classList.remove('btn-disabled');els.micIcon.classList.remove('recording');els.micIcon.className='fas fa-microphone text-2xl';stream.getTracks().forEach(t=>t.stop())};mediaRecorder.start();recognition=new SpeechRecognition();recognition.lang='en-US';recognition.started=true;els.micIcon.className='fas fa-stop text-2xl';els.micIcon.classList.add('recording');els.pronunciationFeedback.innerHTML='<span class="text-brand-500 animate-pulse">Listening...</span>';recognition.onresult=(ev)=>{const transcript=ev.results[0][0].transcript,target=els.englishText.textContent,dist=(s,t)=>{if(!s.length)return t.length;if(!t.length)return s.length;const arr=[];for(let i=0;i<=t.length;i++){arr[i]=[i];for(let j=1;j<=s.length;j++){arr[i][j]=Math.min(arr[i-1][j]+1,arr[i][j-1]+1,arr[i-1][j-1]+(s[j-1].toLowerCase()===t[i-1].toLowerCase()?0:1))}}return arr[t.length][s.length]},scoreVal=Math.max(0,Math.round((1-dist(transcript,target)/Math.max(transcript.length,target.length))*100));let msg='',color='';if(scoreVal>80){msg='Excellent!';color='text-green-600'}else if(scoreVal>50){msg='Good job!';color='text-blue-500'}else{msg='Try again';color='text-red-500'}els.pronunciationFeedback.innerHTML=`<div class="flex flex-col items-center"><span class="text-xs text-slate-400">You said: "${transcript}"</span><span class="text-xl font-bold ${color}">${msg} (${scoreVal}%)</span></div>`};recognition.onend=()=>{recognition.started=false;if(mediaRecorder.state==='recording')mediaRecorder.stop()};recognition.start()}catch(err){console.error(err);alert('マイクへのアクセスを許可してください')}};
document.getElementById('play-recording-btn').onclick=(e)=>{e.stopPropagation();els.recordingPlayer.play()};
document.getElementById('back-to-learning-btn').onclick=()=>switchSection('setup');document.getElementById('back-to-setup-btn').onclick=()=>switchSection('setup');document.getElementById('back-to-home-btn').onclick=()=>switchSection('setup');document.getElementById('abort-test-btn').onclick=()=>switchSection('setup');
document.getElementById('next-question-btn').onclick=()=>{currentQuestionIndex++;if(currentQuestionIndex<quizQuestions.length){showQuizQuestion()}else{document.getElementById('score-percentage').textContent=Math.round(score/quizQuestions.length*100)+'%';document.getElementById('score-text').textContent=`${score} / ${quizQuestions.length} 正解`;const list=document.getElementById('incorrect-answers-list');list.innerHTML='';if(incorrectAnswers.length){document.getElementById('incorrect-answers-container').classList.remove('hidden');incorrectAnswers.forEach(item=>{const li=document.createElement('li');li.className="bg-white p-3 rounded border border-red-100 text-sm";li.innerHTML=`<div class="font-bold text-slate-800">${item.q}</div><div class="text-red-500">正解: ${item.a}</div>`;list.appendChild(li)})}else{document.getElementById('incorrect-answers-container').classList.add('hidden')}switchSection('results')}};
document.getElementById('start-test-btn').onclick=()=>generateQuiz(Math.min(10,selectedWords.length));document.getElementById('restart-btn').onclick=()=>switchSection('setup');
document.getElementById('download-pdf-btn').onclick=()=>document.getElementById('pdf-modal').classList.remove('hidden');document.getElementById('close-modal-btn').onclick=()=>document.getElementById('pdf-modal').classList.add('hidden');document.getElementById('close-modal-icon').onclick=()=>document.getElementById('pdf-modal').classList.add('hidden');
const pdfActions=[{id:'download-list-btn',title:'単語リスト',content:(ws)=>`<ul style="column-count:2;gap:40px;">${ws.map(w=>`<li style="margin-bottom:10px;"><b>${w.english}</b>: ${w.japanese}</li>`).join('')}</ul>`},{id:'download-en-quiz-btn',title:'英単語テスト',content:(ws)=>`<h2>問題</h2><ol>${ws.map(w=>`<li style="margin-bottom:15px;">${w.japanese}: ______________</li>`).join('')}</ol><h2 style="page-break-before:always;">解答</h2><ol>${ws.map(w=>`<li>${w.english}</li>`).join('')}</ol>`},{id:'download-ja-quiz-btn',title:'和訳テスト',content:(ws)=>`<h2>問題</h2><ol>${ws.map(w=>`<li style="margin-bottom:15px;">${w.english}: ______________</li>`).join('')}</ol><h2 style="page-break-before:always;">解答</h2><ol>${ws.map(w=>`<li>${w.japanese}</li>`).join('')}</ol>`},{id:'download-mixed-quiz-btn',title:'混合テスト',content:(ws)=>{const shuf=[...ws].sort(()=>0.5-Math.random());const qs=shuf.map(w=>Math.random()>0.5?`${w.japanese}: ______________`:`${w.english}: ______________`);const as=shuf.map((w,i)=>qs[i].startsWith(w.japanese)?w.english:w.japanese);return`<h2>問題</h2><ol>${qs.map(q=>`<li style="margin-bottom:15px;">${q}</li>`).join('')}</ol><h2 style="page-break-before:always;">解答</h2><ol>${as.map(a=>`<li>${a}</li>`).join('')}</ol>`}},{id:'download-sentence-quiz-btn',title:'例文穴埋め',content:(ws)=>{const valid=ws.filter(w=>w.sentence);if(!valid.length)return'例文がありません';return`<h2>問題</h2><ol>${valid.map(w=>{const k=w.english.split(' ')[0].replace(/[^\w]/g,'');return`<li style="margin-bottom:15px;">${w.sentence.replace(new RegExp(k+'\\w*','i'),'_______')}<br><small>${w.sentence_ja||w.japanese}</small></li>`}).join('')}</ol><h2 style="page-break-before:always;">解答</h2><ol>${valid.map(w=>`<li>${w.english}</li>`).join('')}</ol>`}},{id:'download-sentence-mixed-quiz-btn',title:'例文実戦テスト',content:(ws)=>{const valid=ws.filter(w=>w.sentence);if(!valid.length)return'例文がありません';const qs=[],as=[];valid.sort(()=>0.5-Math.random()).forEach(w=>{const k=w.english.split(' ')[0].replace(/[^\w]/g,'');if(Math.random()>0.5){qs.push(`${w.sentence.replace(new RegExp(k+'\\w*','i'),'_______')}<br><small>${w.sentence_ja||w.japanese}</small>`);as.push(w.english)}else{qs.push(`${w.sentence.replace(new RegExp(`(${k}\\w*)`,'i'),'<u>$1</u>')}<br>下線部和訳: __________________`);as.push(w.japanese)}});return`<h2>問題</h2><ol>${qs.map(q=>`<li style="margin-bottom:15px;">${q}</li>`).join('')}</ol><h2 style="page-break-before:always;">解答</h2><ol>${as.map(a=>`<li>${a}</li>`).join('')}</ol>`}}];
pdfActions.forEach(act=>{document.getElementById(act.id).onclick=()=>{const checks=document.querySelectorAll('.word-checkbox:checked');if(!checks.length)return alert('単語を選択してください');const words=Array.from(checks).map(c=>vocabularyData[c.dataset.index]);const w=window.open('','_blank');w.document.write(`<html><head><title>${act.title}</title><style>body{font-family:sans-serif;margin:30px;}h2{border-bottom:1px solid #000;}</style></head><body><h1>${act.title}</h1>${act.content(words)}</body></html>`);w.document.close();setTimeout(()=>w.print(),500)}});
</script>
